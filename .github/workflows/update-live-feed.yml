name: Update live feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live feed branch
        uses: actions/checkout@v4
        with:
          ref: live-feed
          fetch-depth: 0

      - name: Resolve current YouTube lives
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const channels = [
            { key: 'jovemPan', handle: 'jovempannews', file: 'live/jovemPan.json' },
            { key: 'times', handle: 'otimesbrasil', file: 'live/times.json' }
          ];

          const VIDEO_ID_RE = /^[A-Za-z0-9_-]{11}$/;

          function nearestVideoId(html, markerIndex, radius = 12000) {
            const start = Math.max(0, markerIndex - radius);
            const end = Math.min(html.length, markerIndex + 5000);
            const slice = html.slice(start, end);
            const before = slice.slice(0, Math.max(0, markerIndex - start));
            const beforeIds = [...before.matchAll(/\"videoId\":\"([A-Za-z0-9_-]{11})\"/g)];
            if (beforeIds.length) return beforeIds.at(-1)[1];
            const anyId = slice.match(/\"videoId\":\"([A-Za-z0-9_-]{11})\"/);
            return anyId ? anyId[1] : null;
          }

          function extractLiveVideoId(html) {
            const canonical = html.match(/<link[^>]+rel=[\"']canonical[\"'][^>]+href=[\"']https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})[\"']/i)
              || html.match(/\"urlCanonical\":\"https:\/\/www\.youtube\.com\/watch\?v=([A-Za-z0-9_-]{11})\"/);
            if (canonical && VIDEO_ID_RE.test(canonical[1])) return canonical[1];

            const markers = [
              '\"isLiveNow\":true',
              '\"style\":\"BADGE_STYLE_TYPE_LIVE_NOW\"',
              '\"style\":\"LIVE\"',
              '\"label\":\"AO VIVO\"',
              '\"text\":\"AO VIVO\"',
              '\"label\":\"LIVE\"',
              '\"text\":\"LIVE\"'
            ];
            for (const marker of markers) {
              let index = html.indexOf(marker);
              while (index >= 0) {
                const id = nearestVideoId(html, index);
                if (id) return id;
                index = html.indexOf(marker, index + marker.length);
              }
            }
            return null;
          }

          async function resolve(handle) {
            const response = await fetch(`https://www.youtube.com/@${handle}/live`, {
              redirect: 'follow',
              headers: {
                'user-agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141 Safari/537.36',
                'accept-language': 'pt-BR,pt;q=0.9,en;q=0.7'
              }
            });
            if (!response.ok) throw new Error(`YouTube ${handle}: HTTP ${response.status}`);
            const direct = response.url.match(/[?&]v=([A-Za-z0-9_-]{11})/) || response.url.match(/\/live\/([A-Za-z0-9_-]{11})/);
            const html = await response.text();
            return direct?.[1] || extractLiveVideoId(html);
          }

          (async () => {
            for (const channel of channels) {
              let previous = null;
              try { previous = JSON.parse(fs.readFileSync(channel.file, 'utf8')); } catch {}
              try {
                const videoId = await resolve(channel.handle);
                if (!videoId) throw new Error('nenhuma live atual encontrada');
                fs.mkdirSync('live', { recursive: true });
                fs.writeFileSync(channel.file, JSON.stringify({
                  ok: true,
                  channel: channel.key,
                  handle: channel.handle,
                  videoId,
                  live: true,
                  source: 'github-live-feed',
                  updatedAt: new Date().toISOString()
                }) + '\n');
              } catch (error) {
                if (!previous?.videoId) throw error;
                console.warn(`${channel.key}: ${error.message}; mantendo último ID válido.`);
              }
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated live IDs
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ApuraBrasil Live Bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/jovemPan.json live/times.json
          git commit -m "live: refresh current broadcasts"
          git push origin HEAD:live-feed
